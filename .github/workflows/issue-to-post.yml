name: "Publish from Issue"

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'guide') || contains(github.event.issue.labels.*.name, 'log')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run script to create post
        run: node scripts/create-post-from-issue.js
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: 깃허브 이슈를 통한 자동 포스팅 (Issue #${{ github.event.issue.number }})" || echo "No changes to commit"
          git push

      - name: Comment and close issue
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ 포털에 성공적으로 기록이 등록되었습니다! 확인 후 이 이슈를 닫습니다.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
