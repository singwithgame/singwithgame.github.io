name: "📖 새로운 가이드 추가"
description: "보드게임 규칙이나 가이드 문서를 추가합니다."
title: "[가이드] "
labels: ["guide"]
body:
  - type: dropdown
    id: game_type
    attributes:
      label: "게임 선택"
      options:
        - "BotC (블러드 온 더 클락타워)"
        - "Avalon (아발론)"
        - "공통/기타"
    validations:
      required: true
  - type: input
    id: guide_title
    attributes:
      label: "제목"
      description: "가이드 문서의 제목을 입력해주세요."
      placeholder: "예: 시계탑 초심자를 위한 안내서"
    validations:
      required: true
  - type: textarea
    id: guide_body
    attributes:
      label: "내용"
      description: "마크다운 형식으로 내용을 작성해주세요."
    validations:
      required: true
